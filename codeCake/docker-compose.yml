version: '3.8'

services:
  main_app_pokemon-web:
    build:
      context: ..
      dockerfile: codeCake/Dockerfile
    image: pokemon-frontend:latest
    ports:
      - "21022:80"
    networks:
      - pokemon-network
    depends_on:
      - pokemon-backend

  pokemon-backend:
    build:
      context: ../../pokemon-backend
      dockerfile: Dockerfile
    container_name: pokemon_backend
    ports:
      - "21023:21023"
    environment:
      - NODE_ENV=production
      - PORT=21023
    restart: unless-stopped
    networks:
      - pokemon-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:21023/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pokemon-network:
    driver: bridge
